version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: patho_nxgen
      POSTGRES_USER: patho_app
      POSTGRES_PASSWORD: patho_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-keycloak-schema.sql:/docker-entrypoint-initdb.d/10-keycloak-schema.sql:ro
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: bitnamilegacy/minio:2025.5.24-debian-12-r5
    restart: unless-stopped
    command: server /bitnami/minio/data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/bitnami/minio/data
    ports:
      - "9000:9000"
      - "9001:9001"

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/patho_nxgen?currentSchema=keycloak
      KC_DB_USERNAME: patho_app
      KC_DB_PASSWORD: patho_pass
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=patho_nxgen
      - DB_USER=patho_app
      - DB_PASSWORD=patho_pass
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - MINIO_ENDPOINT=http://minio:9000
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/patho-platform
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - minio
      - keycloak
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
      VITE_KEYCLOAK_URL: http://localhost:8081
    ports:
      - "5173:80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  minio_data:
