<div class="flex flex-col h-full">
  <div class="mb-4 flex items-center justify-between">
    <h1 class="text-xl font-semibold text-gray-900">Samples</h1>
    <div class="flex gap-2">
      <button mat-raised-button color="primary" (click)="router.navigate(['/samples/register'])" id="btn-register-sample">
        <mat-icon>add</mat-icon> Register Sample
      </button>
      <button mat-stroked-button (click)="router.navigate(['/samples/by-barcode'])" id="btn-barcode-lookup">
        <mat-icon>qr_code_scanner</mat-icon> Lookup by Barcode
      </button>
    </div>
  </div>

  <mat-form-field appearance="outline" class="max-w-md mb-4">
    <mat-label>Search samples</mat-label>
    <input matInput id="input-sample-search"
      placeholder="Search by barcode or test type..."
      (input)="onSearch($any($event.target).value)" />
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <div class="ag-theme-quartz flex-1" style="min-height: 400px;">
    <ag-grid-angular
      style="width: 100%; height: 500px;"
      [rowData]="sampleStore.sampleList()"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [loading]="sampleStore.loading()"
      (rowDoubleClicked)="onRowDoubleClicked($event)"
    />
  </div>

  @if (sampleStore.samples()) {
    <div class="mt-3 flex items-center gap-3 text-sm text-gray-600">
      <button mat-stroked-button [disabled]="currentPage() === 0" (click)="previousPage()" id="btn-prev">Previous</button>
      <span>
        Page {{ (sampleStore.samples()?.page ?? 0) + 1 }} of
        {{ sampleStore.totalPages() < 1 ? 1 : sampleStore.totalPages() }}
      </span>
      <button mat-stroked-button [disabled]="sampleStore.isLastPage()" (click)="nextPage()" id="btn-next">Next</button>
    </div>
  }
</div>
